{% extends "layout.html" %}
{% block content %}
<section>
    <h1 class="title">Cart</h1>
    {% if cart_items %}
    <div class="cart-items">
        {% for item in cart_items %}
        <div class="cart-card">
            <img src="{{ item.image }}" alt="{{ item.name }}">
            <div>
                <h2>{{ item.name }}</h2>
                <p class="price">${{ "%.2f"|format(item.price) }}</p>
                <a href="{{ url_for('remove_from_cart', cart_id=item.cart_id) }}" class="btn remove-btn">Remove</a>
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="total">
        <h2>Total: ${{ "%.2f"|format(total) }}</h2>
        <a href="{{ url_for('home') }}" class="btn">continue shopping</a>
        <a href="{{ url_for('home') }}" class="btn pay-btn">Pay</a>
    </div>
    {% else %}
        <p>Your cart is empty.</p>
    {% endif %}
</section>
{% endblock %}
