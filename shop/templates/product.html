{% extends "layout.html" %}
{% block content %}
<section>
    <h1 class="title">Product</h1>
    <div class="product-grid">
        <div class="card">
            <img src="{{ product.image }}" alt="{{ product.name }}">
            <h1>{{ product.name }}</h1>
            <p>{{ product.desc }}</p>
            <p class="price">${{ "%.2f"|format(product.price) }}</p>
            <a href="{{ url_for('add_to_cart', pid=product.id) }}" class="btn">Add to Cart</a>
            <a href="{{ url_for('home') }}" class="btn">Back</a>
        </div>
    </div>
</section>
{% endblock %}
